<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101713">
<meta name="description" content="LIFE OS — жеке өмірді, әдеттерді, білім мен қаржыны басқару жүйесі.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LIFE OS 3.0 — Жеке басқару жүйесі</title>
<style>
:root{--bg:#0d1411;--panel:#151f19;--panel2:#1b2921;--line:#2b3a30;--text:#edf4ee;--muted:#98aa9d;--accent:#b9e6c5;--accent2:#78b98b;--red:#e98b82;--yellow:#e8c77c;--blue:#91bce7;--shadow:0 16px 48px #0004;--radius:18px}
[data-theme=light]{--bg:#f2f6f2;--panel:#fff;--panel2:#edf3ed;--line:#dce6dc;--text:#18241b;--muted:#637568;--accent:#286b43;--accent2:#42875a;--red:#b64e46;--yellow:#9a741f;--blue:#416f9e;--shadow:0 12px 35px #243b2a12}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}a{color:var(--accent)}
.shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}aside{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);padding:24px 16px;background:var(--panel);display:flex;flex-direction:column;gap:22px;z-index:5}.brand{display:flex;align-items:center;gap:12px;padding:0 8px}.brandmark{width:42px;height:42px;border-radius:14px;background:var(--accent);color:#102116;display:grid;place-items:center;font-weight:900;font-size:20px}.brand strong{font-size:17px;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em}.navgroup{display:grid;gap:5px}.navlabel{padding:8px 12px;color:var(--muted);font-size:10px;letter-spacing:.15em;text-transform:uppercase}.navbtn{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:11px 12px;text-align:left;display:flex;gap:12px;align-items:center;width:100%;transition:.15s}.navbtn:hover{background:var(--panel2);color:var(--text)}.navbtn.active{background:var(--panel2);color:var(--accent);font-weight:700}.navbtn .ico{width:22px;text-align:center;font-size:17px}.sidebottom{margin-top:auto}.profile{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px}.profile b{display:block}.profile small{color:var(--muted)}
main{min-width:0;padding:28px clamp(18px,4vw,54px) 90px;max-width:1600px;width:100%;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:28px}.crumb{color:var(--muted);font-size:13px}.topactions{display:flex;gap:8px}.iconbtn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:9px 13px}.iconbtn{width:42px;height:42px;padding:0}.btn.primary{background:var(--accent);border-color:var(--accent);color:#122017;font-weight:750}.btn.ghost{background:transparent}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}.eyebrow{color:var(--accent2);font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:800}.pagehead h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.04em;margin:5px 0}.sub{color:var(--muted);margin:0}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.cols{grid-template-columns:1.3fr 1fr}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:19px;min-width:0}.card h3{margin:0 0 14px;font-size:15px}.statlabel{color:var(--muted);font-size:12px}.statvalue{font-size:27px;font-weight:800;letter-spacing:-.04em;margin:5px 0}.statfoot{font-size:11px;color:var(--muted)}.accent{color:var(--accent)}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.progress{height:7px;border-radius:20px;background:var(--panel2);overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent2);border-radius:20px}.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.itemmain{flex:1;min-width:0}.itemmain b{display:block;overflow-wrap:anywhere}.itemmain small{color:var(--muted)}.check{width:22px;height:22px;border:1px solid var(--line);border-radius:7px;background:transparent;color:#102116;flex:none}.check.done{background:var(--accent);border-color:var(--accent)}.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:var(--panel2);color:var(--muted)}.pill.good{color:var(--accent)}.pill.warn{color:var(--yellow)}.pill.bad{color:var(--red)}
input,select,textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}textarea{min-height:90px;resize:vertical}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid .full{grid-column:1/-1}.formactions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{width:auto;min-width:130px}.empty{padding:26px 10px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:550px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:600}.chart{display:flex;align-items:end;gap:8px;height:145px;padding-top:12px}.barcol{flex:1;display:grid;gap:6px;align-items:end;text-align:center;height:100%}.barcol i{display:block;background:var(--accent2);border-radius:6px 6px 2px 2px;min-height:3px}.barcol small{font-size:10px;color:var(--muted)}.habitrow{display:grid;grid-template-columns:minmax(130px,1fr) minmax(80px,2fr) 38px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.calendar{display:grid;grid-template-columns:repeat(7,minmax(30px,1fr));gap:5px}.day{padding:9px 0;text-align:center;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:12px}.day.today{border-color:var(--accent);color:var(--accent)}.day.done{background:var(--accent);color:#132219}.mobilebar{display:none}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--accent);color:#102116;padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:var(--shadow);z-index:30}
.modalback{position:fixed;inset:0;background:#0009;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{margin:0;font-size:20px}.arabic{font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;font-size:1.15em;line-height:1.9}.rtl{direction:rtl;text-align:right}.kpi{font-size:12px;color:var(--muted)}.hide{display:none!important}
@media(max-width:1050px){.shell{grid-template-columns:210px 1fr}aside{padding:20px 12px}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.shell{display:block}aside{display:none}main{padding:17px 14px calc(90px + env(safe-area-inset-bottom))}.topbar{margin-bottom:22px}.pagehead{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:15px;border-radius:15px}.cols{grid-template-columns:1fr}.mobilebar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:2px;padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);z-index:10}.mobilebar button{border:0;background:transparent;color:var(--muted);font-size:10px;display:grid;gap:2px;justify-items:center;min-width:0;flex:1}.mobilebar button span{font-size:18px}.mobilebar button.active{color:var(--accent)}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.habitrow{grid-template-columns:minmax(100px,1fr) 1fr 32px;gap:7px}.statvalue{font-size:23px}}
@media(min-width:721px) and (max-width:900px){.shell{grid-template-columns:185px 1fr}main{padding:22px 20px}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<aside>
 <div class="brand"><div class="brandmark">L</div><div><strong>LIFE OS</strong><small>PERSONAL SYSTEM 3.0</small></div></div>
 <div class="navgroup">
  <div class="navlabel">Негізгі</div>
  <button class="navbtn active" data-page="home"><span class="ico">⌂</span>Басты бет</button>
  <button class="navbtn" data-page="planner"><span class="ico">▦</span>Жоспарлау</button>
  <button class="navbtn" data-page="habits"><span class="ico">◉</span>Әдеттер</button>
  <button class="navbtn" data-page="spirit"><span class="ico">☾</span>Руханият</button>
  <div class="navlabel">Даму</div>
  <button class="navbtn" data-page="study"><span class="ico">▤</span>Білім</button>
  <button class="navbtn" data-page="finance"><span class="ico">◈</span>Қаржы</button>
  <button class="navbtn" data-page="health"><span class="ico">♡</span>Денсаулық</button>
  <button class="navbtn" data-page="growth"><span class="ico">↗</span>Жеке даму</button>
  <button class="navbtn" data-page="analytics"><span class="ico">▥</span>Талдау</button>
  <div class="navlabel">Жүйе</div>
  <button class="navbtn" data-page="settings"><span class="ico">⚙</span>Баптаулар</button>
 </div>
 <div class="sidebottom profile"><b>Жеке кеңістік</b><small>Деректер осы құрылғыда сақталады</small></div>
</aside>
<main>
 <div class="topbar"><div class="crumb" id="crumb">Жеке кеңістік / Басты бет</div><div class="topactions"><button class="iconbtn" id="themeBtn" title="Тақырып">☼</button><button class="iconbtn" id="quickAdd" title="Жылдам қосу">＋</button></div></div>
 <div id="view"></div>
</main>
</div>
<nav class="mobilebar" id="mobilebar"></nav>
<div id="modalroot"></div><div id="toastroot"></div>
<script>
const DB='lifeos3db', STORE='state', KEY='main';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,c='KZT')=>new Intl.NumberFormat('kk-KZ',{style:'currency',currency:c,maximumFractionDigits:0}).format(Number(n)||0);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const defaults=()=>({version:3,settings:{theme:'dark',lang:'kk',currency:'KZT',name:'Менің кеңістігім',supabaseUrl:'',supabaseKey:''},habits:[],habitLogs:{},tasks:[],goals:[],books:[],transactions:[],accounts:[{id:'cash',name:'Қолма-қол',currency:'KZT',opening:0}],budgets:[],workouts:[],journals:[],mistakes:[],quran:{pages:0,target:1,qaza:0},updatedAt:new Date().toISOString()});
let state=defaults(),page='home',db=null;
const titles={home:'Басты бет',planner:'Жоспарлау',habits:'Әдеттер',spirit:'Руханият',study:'Білім',finance:'Қаржы',health:'Денсаулық',growth:'Жеке даму',analytics:'Талдау',settings:'Баптаулар'};
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function persist(){state.updatedAt=new Date().toISOString();if(db){const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,KEY);await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}}
async function load(){db=await openDB();const tx=db.transaction(STORE,'readonly');const saved=await new Promise(res=>{const r=tx.objectStore(STORE).get(KEY);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)});if(saved)state={...defaults(),...saved};else{const old=localStorage.getItem('lifeos2');if(old){try{state=legacyMigrate(JSON.parse(old));await persist();toast('Ескі LIFE OS деректері көшірілді')}catch(e){state=defaults()}}else await persist()}applyTheme();render()}
function legacyMigrate(o){const s=defaults();s.habits=(o.hab||[]).map(h=>({id:h.id||uid(),name:h.n||'Әдет',category:'Жеке',unit:h.u||'',target:h.g||1}));s.habitLogs=o.done||{};s.tasks=(o.tk||[]).map(t=>({id:t.id||uid(),title:t.n||'Тапсырма',date:t.due||today(),status:t.st==='Орындалды'?'done':'todo',priority:t.pr||'Орташа',notes:t.nt||''}));s.goals=(o.gl||[]).map(g=>({id:g.id||uid(),title:g.n||'Мақсат',description:g.res||'',targetDate:g.e||'',steps:(g.steps||[]).map(x=>({id:x.id||uid(),title:x.n,done:!!x.done}))}));s.books=(o.bk||[]).map(b=>({id:b.id||uid(),title:b.n||'Кітап',author:b.a||'',status:b.st||'Жоспарда',progress:Number(b.p)||0}));s.transactions=(o.tx||[]).map(t=>({id:t.id||uid(),type:t.t==='in'?'income':'expense',amount:Number(t.a)||0,currency:'KZT',category:t.c||'Басқа',date:t.d||today(),note:t.n||''}));s.mistakes=(o.er||[]).map(e=>({id:e.id||uid(),title:e.n||'Жазба',lesson:e.l||'',date:e.d||today()}));s.accounts=(o.acc||[]).map(a=>({id:a.id||uid(),name:a.n||'Шот',currency:'KZT',opening:Number(a.b)||0}));return s}
function applyTheme(){document.documentElement.dataset.theme=state.settings.theme||'dark';document.getElementById('themeBtn').textContent=state.settings.theme==='dark'?'☼':'☾'}
function toast(t){const el=document.getElementById('toastroot');el.innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>el.innerHTML='',2300)}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function header(kicker,desc,action=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${titles[page]}</h1><p class="sub">${desc}</p></div>${action}</div>`}
function cardStat(label,value,foot=''){return `<div class="card"><div class="statlabel">${label}</div><div class="statvalue">${value}</div><div class="statfoot">${foot}</div></div>`}
function empty(t){return `<div class="empty">${t}</div>`}
function home(){const d=today(),logs=state.habitLogs[d]||{},done=Object.values(logs).filter(Boolean).length,open=state.tasks.filter(x=>x.status!=='done').length,month=state.transactions.filter(x=>x.date?.slice(0,7)===d.slice(0,7)),income=month.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),out=month.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);const tasks=state.tasks.filter(x=>x.date===d&&x.status!=='done').slice(0,5);return header('ЖЕКЕ БАСҚАРУ ЖҮЙЕСІ',new Date().toLocaleDateString('kk-KZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),`<button class="btn primary" onclick="openTask()">＋ Тапсырма</button>`)+`<div class="grid stats">${cardStat('Бүгінгі әдеттер',`${done}/${state.habits.length}`,`${pct(done,state.habits.length)}% орындалды`)}${cardStat('Ашық тапсырмалар',open,'Барлық жоспар')}${cardStat('Айлық кіріс',money(income),'Осы ай')}${cardStat('Айлық шығыс',money(out),'Осы ай')}</div><div class="grid cols"><section class="card"><div class="row between"><h3>Бүгінгі әдеттер</h3><button class="btn small ghost" onclick="go('habits')">Барлығын көру →</button></div>${state.habits.length?`<div class="list">${state.habits.slice(0,8).map(h=>`<div class="item"><button class="check ${logs[h.id]?'done':''}" onclick="toggleHabit('${h.id}')">${logs[h.id]?'✓':''}</button><div class="itemmain"><b>${esc(h.name)}</b><small>${esc(h.category||'Жеке')}</small></div></div>`).join('')}</div>`:empty('Әдеттер бөлімінде күнделікті әдеттеріңді қос.')}</section><section class="card"><div class="row between"><h3>Бүгінгі жоспар</h3><button class="btn small ghost" onclick="go('planner')">Жоспар →</button></div>${tasks.length?`<div class="list">${tasks.map(t=>`<div class="item"><button class="check" onclick="completeTask('${t.id}')"></button><div class="itemmain"><b>${esc(t.title)}</b><small>${esc(t.priority||'Орташа')}</small></div></div>`).join('')}</div>`:empty('Бүгінге тапсырма жоқ. Жоспарлау бөлімінен қос.')}</section></div><div class="grid cols" style="margin-top:16px"><section class="card"><h3>Мақсаттар барысы</h3>${state.goals.length?state.goals.slice(0,4).map(g=>{let p=pct(g.steps.filter(s=>s.done).length,g.steps.length);return `<div style="margin:12px 0"><div class="row between"><b>${esc(g.title)}</b><small>${p}%</small></div><div class="progress"><i style="width:${p}%"></i></div></div>`}).join(''):empty('Жеке даму бөлімінде мақсатыңды белгіле.')}</section><section class="card"><h3>Қысқа ескерту</h3><p class="muted">LIFE OS — жоспарлау, руханият, білім, қаржы және жеке дамуды бір жүйеде басқаруға арналған жеке кеңістік.</p><div class="row wrap"><span class="pill good">Offline-ready</span><span class="pill">Қазақша</span><span class="pill">RTL Arabic</span><span class="pill">IndexedDB</span></div></section></div>`}
function planner(){let tasks=[...state.tasks].sort((a,b)=>(a.date||'').localeCompare(b.date||''));return header('УАҚЫТТЫ БАСҚАРУ','Тапсырмалар, мерзімдер және күн тәртібі',`<button class="btn primary" onclick="openTask()">＋ Қосу</button>`)+`<div class="toolbar"><input type="date" id="taskFilter" value="${today()}" onchange="filterTasks(this.value)"><select id="taskStatus" onchange="filterTaskStatus(this.value)"><option value="all">Барлық мәртебе</option><option value="todo">Орындалмаған</option><option value="done">Орындалған</option></select></div><section class="card"><div id="tasklist">${taskRows(tasks)}</div></section>`}
function taskRows(arr){return arr.length?`<div class="list">${arr.map(t=>`<div class="item"><button class="check ${t.status==='done'?'done':''}" onclick="completeTask('${t.id}')">${t.status==='done'?'✓':''}</button><div class="itemmain"><b style="${t.status==='done'?'text-decoration:line-through;opacity:.6':''}">${esc(t.title)}</b><small>${esc(t.date||'Мерзімсіз')} · ${esc(t.priority||'Орташа')} ${t.notes?'· '+esc(t.notes):''}</small></div><button class="btn small ghost" onclick="deleteItem('tasks','${t.id}')">Жою</button></div>`).join('')}</div>`:empty('Бұл сүзгіде тапсырма жоқ.')}
let taskDate=today(),taskStatus='all';
function filterTasks(v){taskDate=v;updateTaskList()}function filterTaskStatus(v){taskStatus=v;updateTaskList()}
function updateTaskList(){let a=state.tasks.filter(t=>(!taskDate||t.date===taskDate)&&(taskStatus==='all'||t.status===taskStatus));document.getElementById('tasklist').innerHTML=taskRows(a)}
function habits(){const logs=state.habitLogs[today()]||{},done=Object.values(logs).filter(Boolean).length;return header('ТҰРАҚТЫЛЫҚ','Әдеттерді белгіле және күнделікті прогресті бақыла',`<button class="btn primary" onclick="openHabit()">＋ Әдет қосу</button>`)+`<div class="grid stats">${cardStat('Бүгін орындалды',`${done}/${state.habits.length}`,`${pct(done,state.habits.length)}%`)}${cardStat('Әдет саны',state.habits.length,'Белсенді әдеттер')}</div><section class="card"><div class="row between"><h3>Күнделікті бақылау</h3><input style="width:auto" type="date" value="${today()}" onchange="habitDate=this.value;render()"></div>${state.habits.length?`<div class="list">${state.habits.map(h=>`<div class="item"><button class="check ${(state.habitLogs[habitDate||today()]||{})[h.id]?'done':''}" onclick="toggleHabit('${h.id}','${habitDate||today()}')">${(state.habitLogs[habitDate||today()]||{})[h.id]?'✓':''}</button><div class="itemmain"><b>${esc(h.name)}</b><small>${esc(h.category||'Жеке')} ${h.target?`· ${h.target} ${esc(h.unit||'')}`:''}</small></div><button class="btn small ghost" onclick="deleteItem('habits','${h.id}')">Жою</button></div>`).join('')}</div>`:empty('Әдет қосу арқылы баста.')}</section>`}
let habitDate=today();
function spirit(){return header('РУХАНИ ӨСУ','Құран, қаза намаз және ғибадат жоспары',`<button class="btn primary" onclick="saveSpirit()">Сақтау</button>`)+`<div class="grid cols"><section class="card"><h3>Құран оқу</h3><div class="formgrid"><div class="field"><label>Оқылған бет (жалпы)</label><input id="qpages" type="number" min="0" value="${state.quran.pages}"></div><div class="field"><label>Күндік мақсат (бет)</label><input id="qtarget" type="number" min="1" value="${state.quran.target}"></div></div><p class="muted">Құран оқу барысын өзіңе ыңғайлы өлшеммен бақыла.</p></section><section class="card"><h3>Қаза намаз</h3><div class="field"><label>Қалған қаза намаз саны</label><input id="qaza" type="number" min="0" value="${state.quran.qaza}"></div><p class="muted">Өтелген намазды азайтып, қалғанын жаңартып отыр.</p></section></div><section class="card" style="margin-top:16px"><h3>Күндік рухани жоспар</h3><p class="arabic rtl">وَقُلْ رَبِّ زِدْنِي عِلْمًا</p><p class="muted">«Раббым, білімімді арттыр» (Таһа, 114).</p><p class="muted">Бұл бөлімдегі көрсеткіштер жеке есеп жүргізуге арналған.</p></section>`}
function study(){return header('БІЛІМ ЖӘНЕ ОҚУ','Кітаптар, оқу барысы және конспектілер',`<button class="btn primary" onclick="openBook()">＋ Кітап қосу</button>`)+`<section class="card"><div class="row between"><h3>Кітап сөресі</h3><span class="pill">${state.books.length} кітап</span></div>${state.books.length?`<div class="list">${state.books.map(b=>`<div class="item"><div class="itemmain"><b>${esc(b.title)}</b><small>${esc(b.author||'Автор көрсетілмеген')} · ${esc(b.status||'Жоспарда')}</small><div class="progress" style="margin-top:8px"><i style="width:${Math.min(100,b.progress||0)}%"></i></div></div><b>${b.progress||0}%</b><button class="btn small ghost" onclick="editBookProgress('${b.id}')">＋</button><button class="btn small ghost" onclick="deleteItem('books','${b.id}')">Жою</button></div>`).join('')}</div>`:empty('Оқитын кітабыңды қос.')}</section>`}
function finance(){let cur=state.settings.currency||'KZT',m=today().slice(0,7),tx=state.transactions.filter(x=>x.date?.slice(0,7)===m),inc=tx.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),out=tx.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);return header('ЖЕКЕ ҚАРЖЫ','Кіріс, шығыс, бюджет және жинақ есебі',`<button class="btn primary" onclick="openTransaction()">＋ Операция</button>`)+`<div class="grid stats">${cardStat('Кіріс',money(inc,cur),'Осы ай')}${cardStat('Шығыс',money(out,cur),'Осы ай')}${cardStat('Айырма',money(inc-out,cur),'Кіріс − шығыс')}${cardStat('Операциялар',tx.length,'Осы ай')}</div><section class="card"><div class="row between"><h3>Операциялар тарихы</h3><span class="pill">Көпвалюталы есеп</span></div>${state.transactions.length?`<div class="tablewrap"><table><thead><tr><th>Күні</th><th>Түрі</th><th>Санат</th><th>Сома</th><th></th></tr></thead><tbody>${[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${esc(x.date)}</td><td>${x.type==='income'?'Кіріс':'Шығыс'}</td><td>${esc(x.category)}</td><td>${money(x.amount,x.currency||cur)}</td><td><button class="btn small ghost" onclick="deleteItem('transactions','${x.id}')">Жою</button></td></tr>`).join('')}</tbody></table></div>`:empty('Алғашқы қаржы операциясын енгіз.')}</section>`}
function health(){return header('ДЕНСАУЛЫҚ','Жаттығу, дене белсенділігі және қалпына келу',`<button class="btn primary" onclick="openWorkout()">＋ Жаттығу жазу</button>`)+`<section class="card"><h3>Жаттығу тарихы</h3>${state.workouts.length?`<div class="list">${[...state.workouts].sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<div class="item"><div class="itemmain"><b>${esc(w.name)}</b><small>${esc(w.date)} · ${esc(w.duration||'')} ${w.notes?'· '+esc(w.notes):''}</small></div><button class="btn small ghost" onclick="deleteItem('workouts','${w.id}')">Жою</button></div>`).join('')}</div>`:empty('Жаттығуларыңды тіркеп отыр.')}</section>`}
function growth(){return header('ЖЕКЕ ДАМУ','Мақсаттар, күнделік және сабақ алу',`<button class="btn primary" onclick="openGoal()">＋ Мақсат</button>`)+`<div class="grid cols"><section class="card"><h3>Мақсаттар</h3>${state.goals.length?`<div class="list">${state.goals.map(g=>{let p=pct(g.steps.filter(s=>s.done).length,g.steps.length);return `<div class="item"><div class="itemmain"><b>${esc(g.title)}</b><small>${esc(g.targetDate||'Мерзім белгіленбеген')} · ${p}%</small><div class="progress"><i style="width:${p}%"></i></div>${g.steps.map(s=>`<div class="row" style="margin-top:6px"><input type="checkbox" style="width:auto" ${s.done?'checked':''} onchange="toggleStep('${g.id}','${s.id}')"><small>${esc(s.title)}</small></div>`).join('')}</div><button class="btn small ghost" onclick="deleteItem('goals','${g.id}')">Жою</button></div>`}).join('')}</div>`:empty('Мақсатыңды және оның қадамдарын енгіз.')}</section><section class="card"><div class="row between"><h3>Күнделік</h3><button class="btn small" onclick="openJournal()">＋ Жазба</button></div>${state.journals.length?`<div class="list">${[...state.journals].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(j=>`<div class="item"><div class="itemmain"><b>${esc(j.title)}</b><small>${esc(j.date)} · ${esc(j.body)}</small></div><button class="btn small ghost" onclick="deleteItem('journals','${j.id}')">Жою</button></div>`).join('')}</div>`:empty('Күн соңындағы ойларыңды жаз.')}</section></div><section class="card" style="margin-top:16px"><div class="row between"><h3>Қателіктерден сабақ</h3><button class="btn small" onclick="openMistake()">＋ Тіркеу</button></div>${state.mistakes.length?state.mistakes.map(m=>`<div class="item"><div class="itemmain"><b>${esc(m.title)}</b><small>${esc(m.date)} · ${esc(m.lesson)}</small></div><button class="btn small ghost" onclick="deleteItem('mistakes','${m.id}')">Жою</button></div>`).join(''):empty('Қателік пен одан алған сабақты тірке.')}</section>`}
function analytics(){let logs=state.habitLogs,days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')});let vals=days.map(d=>pct(Object.values(logs[d]||{}).filter(Boolean).length,state.habits.length));let max=Math.max(1,...vals);return header('ӨЛШЕУ ЖӘНЕ ТАЛДАУ','Апталық белсенділік пен жеке көрсеткіштер')+`<div class="grid stats">${cardStat('Әдеттер',state.habits.length,'Белсенді әдет')}${cardStat('Тапсырмалар',state.tasks.filter(t=>t.status==='done').length,'Орындалғаны')}${cardStat('Кітаптар',state.books.length,'Кітап сөресі')}${cardStat('Мақсаттар',state.goals.length,'Жеке даму')}</div><section class="card"><h3>Соңғы 7 күндегі әдет орындалуы</h3><div class="chart">${vals.map((v,i)=>`<div class="barcol"><i style="height:${Math.max(3,v/max*100)}%"></i><small>${days[i].slice(8)}</small><small>${v}%</small></div>`).join('')}</div></section><p class="muted" style="margin-top:12px">Көрсеткіштер осы құрылғыда тіркелген деректерден есептеледі.</p>`}
function settings(){return header('ЖҮЙЕ ПАРАМЕТРЛЕРІ','Тіл, валюта, сақтық көшірме және синхрондау')+`<div class="grid cols"><section class="card"><h3>Жалпы баптаулар</h3><div class="formgrid"><div class="field full"><label>Кеңістік атауы</label><input id="setName" value="${esc(state.settings.name)}"></div><div class="field"><label>Негізгі валюта</label><select id="setCurrency">${['KZT','EGP','USD','EUR','SAR'].map(c=>`<option ${state.settings.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Тақырып</label><select id="setTheme"><option value="dark" ${state.settings.theme==='dark'?'selected':''}>Қараңғы</option><option value="light" ${state.settings.theme==='light'?'selected':''}>Жарық</option></select></div></div><button class="btn primary" style="margin-top:14px" onclick="saveSettings()">Сақтау</button></section><section class="card"><h3>Тіл және арабша мәтін</h3><p class="muted">Негізгі интерфейс қазақ тілінде. Арабша мәтін енгізілетін өрістер RTL бағытын автоматты қолдайды.</p><div class="field"><label>Арабша жазба үлгісі</label><textarea class="arabic rtl" dir="rtl" placeholder="اكتب هنا باللغة العربية"></textarea></div></section></div><section class="card" style="margin-top:16px"><h3>Деректерді сақтау және көшіру</h3><p class="muted">Деректер IndexedDB ішінде осы браузерде сақталады. Басқа құрылғыға көшіру үшін JSON сақтық көшірмесін экспортта.</p><div class="row wrap"><button class="btn primary" onclick="exportData()">JSON экспорттау</button><label class="btn">JSON импорттау<input type="file" accept="application/json" hidden onchange="importData(event)"></label></div><p class="muted" style="margin-top:15px">Бұл нұсқада бұлттық синхрондау сервер кілттері қосылмағандықтан белсенді емес. Құрылғылар арасында синхрондау үшін Supabase жобасы мен қауіпсіз серверлік конфигурация қажет.</p><span class="pill warn">Бұлттық синхрондау: бапталмаған</span></section><section class="card" style="margin-top:16px"><h3>Қолданба туралы</h3><p class="muted">LIFE OS 3.0 · Local-first · IndexedDB · Offline-ready · Responsive</p><button class="btn danger" onclick="resetData()">Барлық деректі өшіру</button></section>`}
function render(){document.getElementById('crumb').textContent='Жеке кеңістік / '+titles[page];document.getElementById('view').innerHTML=({home,planner,habits,spirit,study,finance,health,growth,analytics,settings})[page]();document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('mobilebar').innerHTML=[['home','⌂','Басты'],['planner','▦','Жоспар'],['habits','◉','Әдет'],['finance','◈','Қаржы'],['settings','⚙','Баптау']].map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${t}</button>`).join('')}
function modal(title,body){document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="iconbtn" onclick="closeModal()">×</button></div>${body}</div></div>`}
function closeModal(){document.getElementById('modalroot').innerHTML=''}
function formField(label,name,placeholder='',type='text',value=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}" value="${esc(value)}" ${type==='number'?'min="0"':''}></div>`}
function formSubmit(form,fn){document.getElementById(form).onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));await fn(d);closeModal();await persist();render()}}
function openTask(){modal('Жаңа тапсырма',`<form id="f">${formField('Тапсырма атауы','title','Мысалы: Құран қайталау')}<div class="formgrid">${formField('Күні','date','', 'date',today())}<div class="field"><label>Басымдық</label><select name="priority"><option>Жоғары</option><option selected>Орташа</option><option>Төмен</option></select></div></div>${formField('Ескерту','notes','Қосымша мәлімет')}<div class="formactions"><button class="btn primary">Сақтау</button></div></form>`);formSubmit('f',async d=>state.tasks.push({id:uid(),...d,status:'todo'}))}
function openHabit(){modal('Жаңа әдет',`<form id="f">${formField('Әдет атауы','name','Мысалы: 20 бет оқу')}<div class="formgrid">${formField('Санат','category','Руханият / Білім')}${formField('Күндік мақсат','target','1','number')} ${formField('Өлшем бірлігі','unit','бет, минут, рет')}</div><div class="formactions"><button class="btn primary">Қосу</button></div></form>`);formSubmit('f',async d=>state.habits.push({id:uid(),...d,target:Number(d.target)||1}))}
function openBook(){modal('Кітап қосу',`<form id="f">${formField('Кітап атауы','title','Кітап атауы')}${formField('Автор','author','Автор аты')}<div class="formgrid">${formField('Оқу прогресі (%)','progress','0','number')}<div class="field"><label>Мәртебе</label><select name="status"><option>Жоспарда</option><option>Оқып жатырмын</option><option>Аяқталды</option></select></div></div><div class="formactions"><button class="btn primary">Сақтау</button></div></form>`);formSubmit('f',async d=>state.books.push({id:uid(),...d,progress:Number(d.progress)||0}))}
function editBookProgress(id){let b=state.books.find(x=>x.id===id);let p=prompt('Оқу прогресі (%)',b.progress||0);if(p!==null){b.progress=Math.max(0,Math.min(100,Number(p)||0));if(b.progress===100)b.status='Аяқталды';persist().then(render)}}
function openTransaction(){modal('Қаржы операциясы',`<form id="f"><div class="formgrid"><div class="field"><label>Түрі</label><select name="type"><option value="expense">Шығыс</option><option value="income">Кіріс</option></select></div>${formField('Сома','amount','0','number')}${formField('Валюта','currency','KZT')} ${formField('Санат','category','Тамақ, оқу, көлік')}${formField('Күні','date','', 'date',today())}${formField('Ескерту','note','Қосымша')}</div><div class="formactions"><button class="btn primary">Сақтау</button></div></form>`);formSubmit('f',async d=>state.transactions.push({id:uid(),...d,amount:Number(d.amount)||0,currency:(d.currency||state.settings.currency).toUpperCase()}))}
function openWorkout(){modal('Жаттығу жазбасы',`<form id="f">${formField('Жаттығу түрі','name','Турник, брусья, жүгіру')}<div class="formgrid">${formField('Күні','date','','date',today())}${formField('Ұзақтығы','duration','45 минут')}</div>${formField('Ескерту','notes','Қайталау, сет, салмақ')}</div><div class="formactions"><button class="btn primary">Сақтау</button></div></form>`);formSubmit('f',async d=>state.workouts.push({id:uid(),...d}))}
function openGoal(){modal('Жаңа мақсат',`<form id="f">${formField('Мақсат атауы','title','Мысалы: Арабша еркін сөйлеу')}${formField('Мерзімі','targetDate','','date',today())}<div class="field"><label>Қадамдар (әр жолға бір қадам)</label><textarea name="steps" placeholder="Күн сайын 30 минут сөйлеу&#10;Апта сайын 1 тақырып жазу"></textarea></div><div class="formactions"><button class="btn primary">Қосу</button></div></form>`);formSubmit('f',async d=>state.goals.push({id:uid(),title:d.title,targetDate:d.targetDate,steps:d.steps.split('\n').filter(Boolean).map(title=>({id:uid(),title,done:false}))}))}
function openJournal(){modal('Күнделік жазбасы',`<form id="f">${formField('Тақырып','title','Бүгінгі ой')}${formField('Күні','date','','date',today())}<div class="field"><label>Жазба</label><textarea name="body" dir="auto" placeholder="Ойыңды жаз..."></textarea></div><div class="formactions"><button class="btn primary">Сақтау</button></div></form>`);formSubmit('f',async d=>state.journals.push({id:uid(),...d}))}
function openMistake(){modal('Қателіктен сабақ алу',`<form id="f">${formField('Не болды?','title','Қысқаша атауы')}${formField('Күні','date','','date',today())}<div class="field"><label>Қандай сабақ алдым?</label><textarea name="lesson" placeholder="Себебі және келесі жолы не өзгертемін?"></textarea></div><div class="formactions"><button class="btn primary">Сақтау</button></div></form>`);formSubmit('f',async d=>state.mistakes.push({id:uid(),...d}))}
async function toggleHabit(id,date=today()){state.habitLogs[date]=state.habitLogs[date]||{};state.habitLogs[date][id]=!state.habitLogs[date][id];await persist();render()}
async function completeTask(id){let t=state.tasks.find(x=>x.id===id);if(t)t.status=t.status==='done'?'todo':'done';await persist();render()}
async function toggleStep(gid,sid){let g=state.goals.find(x=>x.id===gid),s=g?.steps.find(x=>x.id===sid);if(s)s.done=!s.done;await persist();render()}
async function deleteItem(k,id){if(!confirm('Осы жазбаны өшіресің бе?'))return;state[k]=state[k].filter(x=>x.id!==id);await persist();render();toast('Жазба өшірілді')}
function saveSpirit(){state.quran.pages=Number(document.getElementById('qpages').value)||0;state.quran.target=Number(document.getElementById('qtarget').value)||1;state.quran.qaza=Number(document.getElementById('qaza').value)||0;persist().then(()=>toast('Сақталды'))}
function saveSettings(){state.settings.name=document.getElementById('setName').value;state.settings.currency=document.getElementById('setCurrency').value;state.settings.theme=document.getElementById('setTheme').value;applyTheme();persist().then(()=>{render();toast('Баптаулар сақталды')})}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='life-os-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let x=JSON.parse(r.result);if(!x||typeof x!=='object'||!x.version)throw Error();if(!confirm('Қазіргі деректер импортталатын файлмен ауыстырылады. Жалғастырасың ба?'))return;state={...defaults(),...x};await persist();applyTheme();render();toast('Импорт сәтті аяқталды')}catch(err){alert('Файл қате немесе LIFE OS форматына сәйкес емес')}};r.readAsText(f)}
function resetData(){if(!confirm('Барлық дерек толық өшіріледі. Алдымен сақтық көшірме жасағаныңа көз жеткіз.'))return;if(!confirm('Соңғы рет раста: деректерді өшіру керек пе?'))return;state=defaults();persist().then(()=>{render();toast('Жүйе тазартылды')})}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
document.getElementById('themeBtn').onclick=()=>{state.settings.theme=state.settings.theme==='dark'?'light':'dark';applyTheme();persist()};
document.getElementById('quickAdd').onclick=()=>openTask();
window.addEventListener('beforeunload',()=>{if(db){const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,KEY)}});
load().catch(e=>{console.error(e);document.getElementById('view').innerHTML='<div class="card">Қолданбаны іске қосу мүмкін болмады. Браузерде IndexedDB рұқсаты бар екенін тексер.</div>'});
